<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 392" width="520" height="392" role="img" aria-label="fringefix setup wizard"><title>fringefix setup wizard</title><rect x=".5" y=".5" width="519" height="391" rx="9" fill="#202020" stroke="#424242"/><g transform="translate(10 8)"><circle cx="5" cy="5" r="3.6" fill="#ef4444"/><circle cx="13" cy="5" r="3.6" fill="#3b82f6"/><circle cx="9" cy="12" r="3.6" fill="#22c55e"/></g><text x="34" y="21" fill="#ffffff" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="12">fringefix setup wizard</text><path d="M394 16h10M440 11h9v9h-9z" fill="none" stroke="#ffffff" stroke-width="1"/><path d="M486 11l9 9m0-9l-9 9" stroke="#ffffff" stroke-width="1.1"/><g transform="translate(0 32)"><rect width="520" height="360" fill="#202020"/><text x="24" y="30" fill="#a0a0a0" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Step 2 of 3</text><text x="24" y="52" fill="#0078d4" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">Vertical fringing</text><text x="24" y="90" fill="#ffffff" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Press the test pattern button and look at the horizontal lines in the</text><text x="24" y="108" fill="#ffffff" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">right half. Move the vertical strength until the top and bottom edges of</text><text x="24" y="126" fill="#ffffff" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">the lines turn grey. If the fringing got stronger, move the other way: a</text><text x="24" y="144" fill="#ffffff" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">minus mirrors the layout.</text><text x="24" y="213" fill="#ffffff" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Vertical strength</text><rect x="201" y="207.5" width="198" height="5" rx="2.5" fill="#424242"/><rect x="300.0" y="207.5" width="33.0" height="5" rx="2.5" fill="#0078d4"/><rect x="299.5" y="201" width="1" height="18" fill="#a0a0a0"/><circle cx="333.0" cy="210" r="8" fill="#0078d4" stroke="#2b2b2b" stroke-width="2"/><rect x="420.5" y="198.5" width="69" height="23" rx="3" fill="#333333" stroke="#424242"/><text x="483" y="214.0" fill="#ffffff" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="end">1.00</text><rect x="24.5" y="246.5" width="159" height="29" rx="4" fill="#333333" stroke="#424242"/><text x="104.0" y="265.0" fill="#ffffff" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle">Test pattern</text><rect x="112.5" y="310.5" width="119" height="29" rx="4" fill="#333333" stroke="#424242"/><text x="172.0" y="329.0" fill="#ffffff" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle">Back</text><rect x="244.5" y="310.5" width="119" height="29" rx="4" fill="#333333" stroke="#424242"/><text x="304.0" y="329.0" fill="#ffffff" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle">Next</text><rect x="376.5" y="310.5" width="119" height="29" rx="4" fill="#333333" stroke="#424242"/><text x="436.0" y="329.0" fill="#ffffff" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle">Cancel</text></g></svg>
