<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 734" width="640" height="734" role="img" aria-label="fringefix: отчёт и статистика"><title>fringefix: отчёт и статистика</title><rect x=".5" y=".5" width="639" height="733" rx="9" fill="#f3f3f3" stroke="#e0e0e0"/><g transform="translate(10 8)"><circle cx="5" cy="12" r="3.6" fill="#ef4444"/><circle cx="13" cy="12" r="3.6" fill="#3b82f6"/><circle cx="9" cy="5" r="3.6" fill="#22c55e"/></g><text x="34" y="21" fill="#1a1a1a" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="12">fringefix: отчёт и статистика</text><path d="M514 16h10M560 11h9v9h-9z" fill="none" stroke="#1a1a1a" stroke-width="1"/><path d="M606 11l9 9m0-9l-9 9" stroke="#1a1a1a" stroke-width="1.1"/><g transform="translate(0 32)"><rect width="640" height="702" fill="#f3f3f3"/><text x="24" y="28" fill="#606060" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Ничего не отправляется само. Внизу показано ровно то, что уйдёт на сервер, и ты решаешь, отправлять или</text><text x="24" y="44" fill="#606060" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">нет. В отчёте нет имени пользователя, имени компьютера, путей, заголовков окон и постоянного</text><text x="24" y="60" fill="#606060" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">идентификатора. Сервер видит сетевой адрес, но не записывает его.</text><rect x="24.5" y="86.5" width="15" height="15" rx="3" fill="#ffffff" stroke="#606060"/><text x="48" y="98.5" fill="#1a1a1a" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Вести статистику на этом компьютере (хранится только здесь)</text><rect x="24.5" y="108.5" width="15" height="15" rx="3" fill="#0078d4" stroke="#0078d4"/><path d="M28 116.5l3 3 5-6" fill="none" stroke="#fff" stroke-width="1.8"/><text x="48" y="120.5" fill="#1a1a1a" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Система: версия Windows, видеокарта, разрешение монитора, HDR</text><rect x="24.5" y="130.5" width="15" height="15" rx="3" fill="#0078d4" stroke="#0078d4"/><path d="M28 138.5l3 3 5-6" fill="none" stroke="#fff" stroke-width="1.8"/><text x="48" y="142.5" fill="#1a1a1a" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Мои настройки: сдвиги, резкость, автопауза</text><rect x="24.5" y="152.5" width="15" height="15" rx="3" fill="#0078d4" stroke="#0078d4"/><path d="M28 160.5l3 3 5-6" fill="none" stroke="#fff" stroke-width="1.8"/><text x="48" y="164.5" fill="#1a1a1a" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Статистика: счётчики, ошибки и игры (только имена exe)</text><text x="24" y="188" fill="#1a1a1a" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Комментарий, по желанию</text><rect x="24.5" y="194.5" width="591" height="71" rx="3" fill="#ffffff" stroke="#e0e0e0"/><text x="609" y="234.0" fill="#1a1a1a" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="end"></text><text x="34" y="214" fill="#1a1a1a" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Спасибо за приложение!</text><text x="24" y="288" fill="#1a1a1a" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="start">Что будет отправлено (точно этот текст)</text><rect x="24.5" y="296.5" width="591" height="281" rx="3" fill="#ffffff" stroke="#e0e0e0"/><text x="34" y="314.0" fill="#1a1a1a" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace" font-size="11" font-weight="400" text-anchor="start">{</text><text x="34" y="328.2" fill="#1a1a1a" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace" font-size="11" font-weight="400" text-anchor="start">  "schema": "fringefix-report",</text><text x="34" y="342.4" fill="#1a1a1a" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace" font-size="11" font-weight="400" text-anchor="start">  "version": 1,</text><text x="34" y="356.6" fill="#1a1a1a" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace" font-size="11" font-weight="400" text-anchor="start">  "app": {</text><text x="34" y="370.8" fill="#1a1a1a" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace" font-size="11" font-weight="400" text-anchor="start">    "version": "v0.3.0",</text><text x="34" y="385.0" fill="#1a1a1a" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace" font-size="11" font-weight="400" text-anchor="start">    "language": "ru"</text><text x="34" y="399.2" fill="#1a1a1a" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace" font-size="11" font-weight="400" text-anchor="start">  },</text><text x="34" y="413.4" fill="#1a1a1a" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace" font-size="11" font-weight="400" text-anchor="start">  "system": {</text><text x="34" y="427.6" fill="#1a1a1a" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace" font-size="11" font-weight="400" text-anchor="start">    "windows_build": 26100,</text><text x="34" y="441.8" fill="#1a1a1a" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace" font-size="11" font-weight="400" text-anchor="start">    "gpu": "NVIDIA GeForce RTX 5070",</text><text x="34" y="456.0" fill="#1a1a1a" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace" font-size="11" font-weight="400" text-anchor="start">    "monitor": {</text><text x="34" y="470.2" fill="#1a1a1a" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace" font-size="11" font-weight="400" text-anchor="start">      "width": 3840,</text><text x="34" y="484.4" fill="#1a1a1a" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace" font-size="11" font-weight="400" text-anchor="start">      "height": 2160,</text><text x="34" y="498.6" fill="#1a1a1a" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace" font-size="11" font-weight="400" text-anchor="start">      "hdr": false</text><text x="34" y="512.8" fill="#1a1a1a" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace" font-size="11" font-weight="400" text-anchor="start">    }</text><text x="34" y="527.0" fill="#1a1a1a" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace" font-size="11" font-weight="400" text-anchor="start">  },</text><text x="34" y="541.2" fill="#1a1a1a" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace" font-size="11" font-weight="400" text-anchor="start">  "settings": {</text><text x="34" y="555.4" fill="#1a1a1a" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace" font-size="11" font-weight="400" text-anchor="start">    "red": {</text><text x="34" y="569.6" fill="#1a1a1a" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace" font-size="11" font-weight="400" text-anchor="start">      "x": 0.25,</text><rect x="24.5" y="614.5" width="188" height="29" rx="4" fill="#ffffff" stroke="#e0e0e0"/><text x="118.5" y="633.0" fill="#1a1a1a" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle">Отправить</text><rect x="225.5" y="614.5" width="188" height="29" rx="4" fill="#ffffff" stroke="#e0e0e0"/><text x="319.5" y="633.0" fill="#1a1a1a" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle">Открыть issue на GitHub</text><rect x="426.5" y="614.5" width="188" height="29" rx="4" fill="#ffffff" stroke="#e0e0e0"/><text x="520.5" y="633.0" fill="#1a1a1a" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle">Скопировать</text><rect x="24.5" y="652.5" width="188" height="29" rx="4" fill="#ffffff" stroke="#e0e0e0"/><text x="118.5" y="671.0" fill="#1a1a1a" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle">Сохранить в файл...</text><rect x="225.5" y="652.5" width="188" height="29" rx="4" fill="#ffffff" stroke="#e0e0e0"/><text x="319.5" y="671.0" fill="#1a1a1a" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle">Очистить статистику</text><rect x="426.5" y="652.5" width="188" height="29" rx="4" fill="#ffffff" stroke="#e0e0e0"/><text x="520.5" y="671.0" fill="#1a1a1a" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle">Закрыть</text></g></svg>
