<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Desktop - Frame capture - Frame signature - Shader - Overlay window">
  <style>
    .ink { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .fill { fill: #94a3b8; }
    .bg { fill: #131a2a; }
    .t1 { fill: #f1f4fb; }
    .t2 { fill: #9aa5bd; }
    .box { fill: #1c2538; stroke: #31405e; }
    .chip { fill: #1c2538; stroke: #31405e; }
    .arrow { fill: none; stroke: #6b7a99; stroke-width: 2.5; }
    @media (prefers-color-scheme: light) {
      .ink { stroke: #475569; }
      .fill { fill: #475569; }
      .bg { fill: #eef1f8; }
      .t1 { fill: #131a2a; }
      .t2 { fill: #566079; }
      .box { fill: #ffffff; stroke: #cfd7e6; }
      .chip { fill: #ffffff; stroke: #cfd7e6; }
      .arrow { stroke: #7a88a6; }
    }
  </style>
  <rect class="bg" width="1200" height="300" rx="18"/>
  <rect class="box" x="40" y="60" width="190" height="104" rx="14"/><text class="t1" x="62" y="98" font-family="system-ui, 'Segoe UI', sans-serif" font-size="19" font-weight="600">Desktop</text><text class="t2" x="62" y="124" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13">DWM composes the screen</text><rect class="box" x="266" y="60" width="190" height="104" rx="14"/><rect x="266" y="60" width="8" height="104" rx="4" fill="#22c55e"/><text class="t1" x="288" y="98" font-family="system-ui, 'Segoe UI', sans-serif" font-size="19" font-weight="600">Frame capture</text><text class="t2" x="288" y="124" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13">Desktop Duplication, DXGI</text><rect class="box" x="492" y="60" width="190" height="104" rx="14"/><rect x="492" y="60" width="8" height="104" rx="4" fill="#3b82f6"/><text class="t1" x="514" y="98" font-family="system-ui, 'Segoe UI', sans-serif" font-size="19" font-weight="600">Frame signature</text><text class="t2" x="514" y="124" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13">skips its own echo</text><rect class="box" x="718" y="60" width="190" height="104" rx="14"/><rect x="718" y="60" width="8" height="104" rx="4" fill="#ef4444"/><text class="t1" x="740" y="98" font-family="system-ui, 'Segoe UI', sans-serif" font-size="19" font-weight="600">Shader</text><text class="t2" x="740" y="124" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13">R, G, B shift and</text><text class="t2" x="740" y="142" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13">laplacian</text><rect class="box" x="944" y="60" width="190" height="104" rx="14"/><rect x="944" y="60" width="8" height="104" rx="4" fill="#22c55e"/><text class="t1" x="966" y="98" font-family="system-ui, 'Segoe UI', sans-serif" font-size="19" font-weight="600">Overlay window</text><text class="t2" x="966" y="124" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13">topmost, click-through,</text><text class="t2" x="966" y="142" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13">outside capture</text><path class="arrow" d="M236 112h24M252 104l8 8-8 8"/><path class="arrow" d="M462 112h24M478 104l8 8-8 8"/><path class="arrow" d="M688 112h24M704 104l8 8-8 8"/><path class="arrow" d="M914 112h24M930 104l8 8-8 8"/>
  <path class="arrow" d="M266 184v14h872v-14"/>
  <text class="t2" x="266" y="222" font-family="system-ui, 'Segoe UI', sans-serif" font-size="14">Capture and overlay thread</text>
  <text class="t2" x="40" y="262" font-family="system-ui, 'Segoe UI', sans-serif" font-size="14">Main thread: tray, settings windows, updates, reports</text>
  <text class="t2" x="40" y="284" font-family="system-ui, 'Segoe UI', sans-serif" font-size="14">Auto-pause: a game in front releases the device and the window</text>
</svg>
