name: ci

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc make
      # версию считаем вне msys2: его git ругается на владельца каталога и вернул бы dev
      - name: version
        shell: bash
        run: echo "VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"
      # тесты разбора конфига, версий, ссылок релиза и sha256
      - run: make test CC=gcc
      # exe со вшитой версией и репозиторием для обновлений
      - run: make win CC_WIN=gcc WINDRES=windres VERSION="${{ env.VERSION }}" REPO="${{ github.repository }}"
      # хеш лежит рядом с exe, по нему обновлятор сверяет загрузку
      - run: cd build && sha256sum fringefix.exe > fringefix.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: fringefix-windows
          path: |
            build/fringefix.exe
            build/fringefix.exe.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fringefix-windows
      - run: gh release create "$GITHUB_REF_NAME" fringefix.exe fringefix.exe.sha256 --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
