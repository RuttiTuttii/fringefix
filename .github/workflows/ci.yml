name: ci

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+']
  pull_request:

permissions:
  contents: read

jobs:
  # тесты портативных модулей на Linux двумя компиляторами под санитайзерами, предупреждения считаются ошибками
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - run: make test CC=${{ matrix.cc }} SAN=1 WERROR=1

  # то же приложение, собранное кросс-компилятором mingw-w64 с Linux; ловит ошибки, которые не видны в msys2
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64
      - run: make win WERROR=1 REPO="${{ github.repository }}" REPORT_URL="${{ vars.REPORT_URL }}" VERSION="$(git describe --tags --always)"
      # exe должен тянуть только ожидаемые библиотеки: сети в нём нет, кроме WinHTTP для обновлений
      - run: x86_64-w64-mingw32-objdump -p build/fringefix.exe | grep "DLL Name" | sort -u
      - uses: actions/upload-artifact@v4
        with:
          name: fringefix-windows-mingw-linux
          path: build/fringefix.exe

  # приёмник отчётов на Python: ruff и тесты
  server:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # на серверах Python 3.10, поэтому проверяется и он
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest ruff
      - run: ruff check server
      - run: cd server && python -m pytest -q

  # сборка для релиза: msys2 на Windows-раннере со свежими заголовками
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc make
      # версию считаем вне msys2: его git ругается на владельца каталога и вернул бы dev
      - name: version
        shell: bash
        run: echo "VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"
      # тесты разбора конфига, версий, ссылок релиза и sha256
      - run: make test CC=gcc
      # exe со вшитой версией и репозиторием для обновлений
      - run: make win CC_WIN=gcc WINDRES=windres VERSION="${{ env.VERSION }}" REPO="${{ github.repository }}" REPORT_URL="${{ vars.REPORT_URL }}"
      # хеш лежит рядом с exe, по нему обновлятор сверяет загрузку
      - run: cd build && sha256sum fringefix.exe > fringefix.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: fringefix-windows
          path: |
            build/fringefix.exe
            build/fringefix.exe.sha256

  # релиз только из тега и только если зелёные Linux, Windows и сервер
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, linux, cross, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fringefix-windows
      # тег с -beta.N выходит как prerelease: /releases/latest его не отдаёт, и обычные пользователи обновляются мимо беты
      - run: |
          flag=""
          case "$GITHUB_REF_NAME" in *-beta.*) flag="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" fringefix.exe fringefix.exe.sha256 --repo "$GITHUB_REPOSITORY" --generate-notes $flag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
